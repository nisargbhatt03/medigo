openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Medigo Hospital POS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient management
  - name: doctors
    description: Doctor management
  - name: appointments
    description: Appointment/token management
  - name: queue
    description: Queue management
  - name: prescriptions
    description: Prescription management
  - name: referrals
    description: Referral management
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found

  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: List all doctors
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"

  /doctors/{id}:
    get:
      operationId: getDoctor
      tags: [doctors]
      summary: Get a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments (optionally filter by date or doctorId)
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: doctorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentBody"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /queue/today:
    get:
      operationId: getTodayQueue
      tags: [queue]
      summary: Get today's full queue
      responses:
        "200":
          description: Today's queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"

  /queue/call-next:
    post:
      operationId: callNextPatient
      tags: [queue]
      summary: Call next patient in queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallNextBody"
      responses:
        "200":
          description: Next patient called
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"

  /prescriptions:
    post:
      operationId: createPrescription
      tags: [prescriptions]
      summary: Create a prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrescriptionBody"
      responses:
        "201":
          description: Prescription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/patient/{patientId}:
    get:
      operationId: getPatientPrescriptions
      tags: [prescriptions]
      summary: Get prescriptions for a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"

  /referrals:
    get:
      operationId: listReferrals
      tags: [referrals]
      summary: List referrals
      parameters:
        - name: fromDoctorId
          in: query
          schema:
            type: integer
        - name: toDoctorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Referrals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Referral"
    post:
      operationId: createReferral
      tags: [referrals]
      summary: Create a referral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReferralBody"
      responses:
        "201":
          description: Referral created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Patient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        bloodGroup:
          type: string
        phone:
          type: string
        address:
          type: string
        registeredAt:
          type: string
      required: [id, name, age, gender, phone, registeredAt]

    CreatePatientBody:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        bloodGroup:
          type: string
        phone:
          type: string
        address:
          type: string
      required: [name, age, gender, phone]

    Doctor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        specialty:
          type: string
        qualification:
          type: string
        cabinNumber:
          type: string
        status:
          type: string
          description: "available | busy | break | offline"
        patientsToday:
          type: integer
        waitingCount:
          type: integer
      required: [id, name, specialty, qualification, cabinNumber, status]

    Appointment:
      type: object
      properties:
        id:
          type: integer
        tokenNumber:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        doctorId:
          type: integer
        doctorName:
          type: string
        date:
          type: string
        timeSlot:
          type: string
        status:
          type: string
          description: "waiting | in-consultation | completed | referred | cancelled"
        waitTime:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, tokenNumber, patientId, patientName, doctorId, doctorName, date, timeSlot, status, createdAt]

    CreateAppointmentBody:
      type: object
      properties:
        patientId:
          type: integer
        doctorId:
          type: integer
        date:
          type: string
        timeSlot:
          type: string
      required: [patientId, doctorId, date, timeSlot]

    UpdateAppointmentBody:
      type: object
      properties:
        status:
          type: string
        doctorId:
          type: integer
        timeSlot:
          type: string

    QueueEntry:
      type: object
      properties:
        id:
          type: integer
        tokenNumber:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        doctorId:
          type: integer
        doctorName:
          type: string
        cabinNumber:
          type: string
        status:
          type: string
        waitTime:
          type: ["string", "null"]
        timeSlot:
          type: string
      required: [id, tokenNumber, patientId, patientName, doctorId, doctorName, cabinNumber, status, timeSlot]

    CallNextBody:
      type: object
      properties:
        doctorId:
          type: integer
      required: [doctorId]

    Prescription:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        doctorId:
          type: integer
        doctorName:
          type: string
        appointmentId:
          type: ["integer", "null"]
        medicines:
          type: string
        instructions:
          type: string
        diagnosis:
          type: string
        sendToPharmacy:
          type: boolean
        status:
          type: string
          description: "pending | sent | dispensed"
        createdAt:
          type: string
      required: [id, patientId, patientName, doctorId, doctorName, medicines, diagnosis, sendToPharmacy, status, createdAt]

    CreatePrescriptionBody:
      type: object
      properties:
        patientId:
          type: integer
        doctorId:
          type: integer
        appointmentId:
          type: ["integer", "null"]
        medicines:
          type: string
        instructions:
          type: string
        diagnosis:
          type: string
        sendToPharmacy:
          type: boolean
      required: [patientId, doctorId, medicines, diagnosis, sendToPharmacy]

    Referral:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientName:
          type: string
        fromDoctorId:
          type: integer
        fromDoctorName:
          type: string
        toDoctorId:
          type: integer
        toDoctorName:
          type: string
        reason:
          type: string
        urgency:
          type: string
          description: "high | normal | low"
        status:
          type: string
          description: "pending | accepted | completed"
        createdAt:
          type: string
      required: [id, patientId, patientName, fromDoctorId, fromDoctorName, toDoctorId, toDoctorName, reason, urgency, status, createdAt]

    CreateReferralBody:
      type: object
      properties:
        patientId:
          type: integer
        fromDoctorId:
          type: integer
        toDoctorId:
          type: integer
        reason:
          type: string
        urgency:
          type: string
      required: [patientId, fromDoctorId, toDoctorId, reason, urgency]

    DashboardStats:
      type: object
      properties:
        patientsToday:
          type: integer
        doctorsActive:
          type: integer
        revenueToday:
          type: integer
        queueWaiting:
          type: integer
        patientsPerDoctor:
          type: array
          items:
            type: object
            properties:
              doctorName:
                type: string
              count:
                type: integer
            required: [doctorName, count]
        recentActivity:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              time:
                type: string
            required: [message, time]
      required: [patientsToday, doctorsActive, revenueToday, queueWaiting, patientsPerDoctor, recentActivity]
