packages:
  "recharts": "Required for admin dashboard analytics and statistics charts"
  "date-fns": "For human-readable date and time formatting across all views"
  "framer-motion": "For page transitions, list animations, and interactive component feedback"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to resolve Tailwind CSS class conflicts"

images:
  - path: "artifacts/medigo/public/images/medigo-hero.png"
    description: "Abstract modern healthcare medical technology background with deep clinical blue and teal gradients, subtle glowing lines, and soft glassmorphism effects, no text"
    aspect_ratio: "16:9"
  - path: "artifacts/medigo/public/images/avatar-doc.png"
    description: "High quality professional headshot portrait of an Indian male doctor wearing a white coat and stethoscope, studio lighting, soft blue background"
    aspect_ratio: "1:1"

notes:
  - "The app uses role-based routing (Admin, Doctor, Patient, Reception). The root path serves as a role selector."
  - "API hooks are imported from @workspace/api-client-react as specified in the environment."
  - "Using pure React state for forms to minimize external validation library dependency boilerplate while keeping full functionality."
